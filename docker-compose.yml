# FHIR Learning Academy
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fhir-learning-db
    environment:
      POSTGRES_DB: fhir_learning
      POSTGRES_USER: fhirld
      POSTGRES_PASSWORD: fhirld
    ports:
      - "5432:5432"
    volumes:
      - fhir_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fhirld -d fhir_learning"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fhir_pg_data:
